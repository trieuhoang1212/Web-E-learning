<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Thời Tiết</title>
    <link rel="stylesheet" href="./thoitietstype.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <h1>ỨNG DỤNG THỜI TIẾT</h1>
    </header>
    <!-- nhập tên thành phố -->

    <div class="container">
      <div class="search-form">
        <div class="form-group">
          <label for="city">Tên thành phố:</label>
          <input
            type="text"
            id="city"
            class="search-input"
            placeholder="Nhập tên thành phố..."
          />
        </div>
        <button id="btn-search" class="search-button">Tìm Kiếm</button>
      </div>
    </div>
    <script src="thoitiet.js"></script>
  </body>
</html>
