<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Thời Tiết</title>
    <link rel="stylesheet" href="./thoitietstype.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <h1>ỨNG DỤNG THỜI TIẾT</h1>
    </header>
    <!-- nhập tên thành phố -->

    <div class="container">
      <h2>Nhập tên thành phố của bạn</h2>
      
      <form class="search-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="city">Thành phố:</label>
          <input
            type="text"
            id="city"
            class="search-input"
            placeholder="vd: Hanoi, Tokyo..."
          />
        </div>
        <button type="button" id="btn-search">TÌM KIẾM</button>
      </form>

      <div id="weather-result" class="weather-result"></div>
    </div>
    </div>
    <script src="thoitiet.js"></script>
  </body>
</html>
