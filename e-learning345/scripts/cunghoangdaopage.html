<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Cung Hoàng Đạo</title>
    <link rel="stylesheet" href="./cunghoangdaostype.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="menu">
      <p class="menu-item"><a href="homepage.html">Home</a></p>
      <p class="menu-item">
        <a href="cunghoangdaopage.html">Cung Hoàng Đạo</a>
      </p>
      <p class="menu-item"><a href="danhbapage.html">Danh Bạ</a></p>
      <p class="menu-item"><a href="thoitietpage.html">Thời Tiết</a></p>
    </div>
    <header>
      <h1>CUNG HOÀNG ĐẠO</h1>
      <h4>NGUYỄN HOÀNG TRIỀU - 092205002523</h4>
    </header>
    <div class="container">
      <h2>TÌM CUNG HOÀNG ĐẠO CỦA BẠN</h2>
      <p>Nhập ngày tháng năm sinh của bạn</p>
      <form class="search-form">
        <div class="form-group">
          <label for="day">Ngày:</label>
          <input
            type="text"
            id="day"
            class="search-input"
            placeholder="Nhập ngày..."
          />
        </div>
        <div class="form-group">
          <label for="month">Tháng:</label>
          <input
            type="text"
            id="month"
            class="search-input"
            placeholder="Nhập tháng..."
          />
        </div>
        <div class="form-group">
          <label for="year">Năm:</label>
          <input
            type="text"
            id="year"
            class="search-input"
            placeholder="Nhập năm..."
          />
        </div>
      </form>
      <button type="button" id="btn-search">TRA CỨU</button>
    </div>
    <div id="result" class="result"></div>
    <div id="img-result" class="img-result"></div>
    <script src="cunghoangdao.js"></script>
  </body>
</html>
